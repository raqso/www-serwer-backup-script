name: shellcheck

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: ./scripts/shellcheck.sh
      - run: ./tests/download_test.sh
      - name: wsb is up to date with src/
        run: |
          ./scripts/generate.sh
          git diff --exit-code -- wsb || { echo "::error::wsb is out of date: run scripts/generate.sh and commit wsb"; exit 1; }
