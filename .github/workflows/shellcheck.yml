name: shellcheck

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: ./scripts/shellcheck.sh
      - run: ./tests/release_url_test.sh
