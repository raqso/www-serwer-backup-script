# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config-1.json

# Local changes go into profiles.d/*.yaml (never touched by updates), not into this file: they are
# read after it and override its values (a list is replaced as a whole). No match is fine.
includes:
  - "profiles.d/*.yaml"

default:
  repository: $LOCAL_BACKUPS_PATH
  initialize: true
  password-file: ./password-file
  # restic's default; 'max' costs much more CPU for a slightly smaller repository.
  # Only affects newly written data.
  compression: auto

database:
  inherit: default

  backup:
    stdin: true
    # Flags chosen to work with limited shared-hosting privileges (no PROCESS,
    # LOCK TABLES, RELOAD or EVENT needed). --loose- makes MariaDB ignore the
    # MySQL-only GTID option instead of failing. The credentials come from the file written
    # by backup.sh. resticprofile hands this line to sh unexpanded, so sh expands "$DB_NAME".
    # --defaults-file (and no login-path file for MySQL clients) means ~/.my.cnf and
    # ~/.mylogin.cnf can't override config.conf; the price is that /etc/my.cnf is not read
    # either (e.g. a custom socket path set there).
    stdin-command: 'MYSQL_TEST_LOGIN_FILE=/dev/null/none mysqldump --defaults-file=./mysqldump.cnf --single-transaction --no-tablespaces --routines --default-character-set=utf8mb4 --hex-blob --loose-set-gtid-purged=OFF "$DB_NAME"'
    stdin-filename: "database_dump.sql"
    tag:
      - db

www:
  inherit: default

  backup:
    source:
      - $DIRECTORY_TO_BACKUP
    exclude:
      - "$DIRECTORY_TO_BACKUP/cache"
      - "$DIRECTORY_TO_BACKUP/log"
      - "$DIRECTORY_TO_BACKUP/tmp"
      - "$DIRECTORY_TO_BACKUP/img/tmp"
      - "$DIRECTORY_TO_BACKUP/img/**/*_default.jpg"
    tag:
      - www

# Repository-wide work, run once by backup.sh after both backups ('forget', then 'check').
maintenance:
  inherit: default
  initialize: false

  # No --path or --tag filter: covers the database and www snapshots. restic groups
  # snapshots by host and paths, so the two are kept separately and the latest
  # snapshot of each is always kept.
  forget:
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 12
    prune: true
