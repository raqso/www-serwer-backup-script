# yaml-language-server: $schema=https://creativeprojects.github.io/resticprofile/jsonschema/config-1.json

global:
  # nice 15 for resticprofile and everything it starts (restic, mysqldump, rclone),
  # so the backup gives way to the website. Linux derives the disk priority from it
  # (best-effort, lowest level), so 'ionice' is not needed.
  priority: background

default:
  repository: $LOCAL_BACKUPS_PATH
  initialize: true
  password-file: ./password-file
  # restic's default; 'max' costs much more CPU for a slightly smaller repository.
  # Only affects newly written data.
  compression: auto

database:
  inherit: default

  backup:
    stdin: true
    # Flags chosen to work with limited shared-hosting privileges (no PROCESS,
    # LOCK TABLES, RELOAD or EVENT needed). --loose- makes MariaDB ignore the
    # MySQL-only GTID option instead of failing.
    stdin-command: "mysqldump --single-transaction --no-tablespaces --routines --default-character-set=utf8mb4 --hex-blob --loose-set-gtid-purged=OFF -u$DB_USER -p$DB_PASS -h$DB_HOST $DB_NAME"
    stdin-filename: "database_dump.sql"
    tag:
      - db

# Runs after 'database' (see backup.sh), so the repository-wide work happens once per run:
# retention for both profiles, prune and check, then the upload.
www:
  inherit: default

  backup:
    source:
      - $DIRECTORY_TO_BACKUP
    exclude:
      - "$DIRECTORY_TO_BACKUP/cache"
      - "$DIRECTORY_TO_BACKUP/log"
      - "$DIRECTORY_TO_BACKUP/tmp"
      - "$DIRECTORY_TO_BACKUP/img/tmp"
      - "$DIRECTORY_TO_BACKUP/img/**/*_default.jpg"
    tag:
      - www
    # Reads the repository structure, not the file contents (no --read-data).
    check-after: true
    run-after: rclone sync "$LOCAL_BACKUPS_PATH" "$RCLONE_REMOTE_NAME" --log-level INFO ${RCLONE_BWLIMIT:+--bwlimit "$RCLONE_BWLIMIT"}

  retention:
    # Without this, version 1 of the resticprofile config never applies the policy below.
    after-backup: true
    # No --path filter: the policy covers the database snapshots too. restic groups
    # snapshots by host and paths, so www and database are kept separately and the
    # latest snapshot of each is always kept.
    path: false
    keep-daily: 7
    keep-weekly: 4
    keep-monthly: 12
    prune: true
