name: wsb
help: Backs up a website (files and one MySQL/MariaDB database) from a shared hosting account.
version: 0.4.0

commands:
- name: backup
  help: |-
    Run a backup.
    Without -v a successful run prints nothing (cron sends no mail); the full output of every run is kept in logs/. Failures print an ERROR and the end of the log to stderr.
  flags:
  - long: --verbose
    short: -v
    help: show the backup output (it is always written to logs/)
  dependencies:
    resticprofile: run ./wsb install
    rclone: run ./wsb install

- name: install
  help: |-
    Install or update restic, resticprofile and rclone into ~/bin (each download is checked against its official SHA-256 checksum).
    Also creates the initial password-file, config.conf and profiles.d/ next to wsb. Safe to run again: existing password-file and config.conf are never overwritten.
  dependencies:
    http_client:
      command: [curl, wget]
      help: required but not installed. Ask your hosting provider or install it first.
    sha256:
      command: [sha256sum, shasum]
      help: required but not installed. Ask your hosting provider or install it first.
    tar: required but not installed. Ask your hosting provider or install it first.
    gzip: required but not installed. Ask your hosting provider or install it first.
    bzip2: required but not installed. Ask your hosting provider or install it first.
    unzip: required but not installed. Ask your hosting provider or install it first.

- name: update
  help: |-
    Update wsb to the latest release (or the one given with --version), then run wsb install.
    Downloads get.sh of that release from GitHub and runs it for this directory. config.conf, password-file and profiles.d/ are kept.
  flags:
  - long: --version
    arg: tag
    help: "release tag to install, e.g. v0.5.0 (default: the latest release)"
  dependencies:
    http_client:
      command: [curl, wget]
      help: required but not installed. Ask your hosting provider or install it first.
